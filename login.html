<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TradeFlow LC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='20' fill='%2300c2ff'/%3E%3Ctext x='50' y='67' font-family='Arial' font-size='50' font-weight='bold' text-anchor='middle' fill='%23061022'%3ELC%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060914; --ink:#eef3ff; --muted:rgba(238,243,255,.58); --faint:rgba(238,243,255,.35);
  --glass:rgba(16,22,44,.55); --line:rgba(255,255,255,.09);
  --cyan:#22d3ee; --blue:#4f8cff; --violet:#9b6bff; --pink:#ff5fd2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif; color:var(--ink); background:var(--bg);
  min-height:100vh; display:grid; grid-template-columns:1.15fr 1fr; overflow:hidden; position:relative;
}

/* ---------- background ---------- */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.blob{position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; will-change:transform}
.b1{width:48vw;height:48vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#2b5bff,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:42vw;height:42vw;right:-10vw;bottom:-14vw;background:radial-gradient(circle,#9b3bff,transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.b3{width:30vw;height:30vw;left:38vw;top:30vh;background:radial-gradient(circle,#00d4ff55,transparent 65%);animation:drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vw,6vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-8vw,-6vh) scale(1.1)}}
.grid{
  position:absolute; inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px; opacity:.35;
  mask-image:radial-gradient(ellipse at 40% 45%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 40% 45%,#000 20%,transparent 75%);
}

/* ---------- left: brand ---------- */
.brand{position:relative; z-index:1; padding:56px 64px; display:flex; flex-direction:column; justify-content:space-between; min-height:100vh}
.logo{display:flex; align-items:center; gap:14px}
.logo-mark{
  width:46px;height:46px;border-radius:14px; display:grid; place-items:center;
  font-family:'Syne',sans-serif; font-weight:800; font-size:18px; color:#061022;
  background:linear-gradient(135deg,var(--cyan),var(--blue) 60%,var(--violet));
  box-shadow:0 0 30px rgba(34,211,238,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.logo-text{font-family:'Syne',sans-serif; font-weight:700; font-size:20px; letter-spacing:.2px}
.hero h2{
  font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(32px,3.6vw,52px); line-height:1.05; letter-spacing:-.5px; margin-bottom:18px;
}
.hero h2 span{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted); font-size:16px; line-height:1.6; max-width:440px}

.route{margin-top:34px; max-width:520px}
.route svg{width:100%; height:auto; overflow:visible}
.route .track{fill:none; stroke:rgba(255,255,255,.14); stroke-width:2; stroke-dasharray:3 7; stroke-linecap:round}
.route .done{fill:none; stroke:url(#routeGrad); stroke-width:3; stroke-linecap:round; stroke-dasharray:420; stroke-dashoffset:420; animation:draw 7s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:420}70%,100%{stroke-dashoffset:0}}
.node-ring{fill:none; stroke:var(--cyan); stroke-width:1.5; opacity:.6; transform-box:fill-box; transform-origin:center; animation:ping 2.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
.route text{font-size:11px; fill:var(--muted); font-family:'DM Sans',sans-serif; letter-spacing:.4px}

.chips{display:flex; gap:10px; flex-wrap:wrap}
.chip{
  padding:9px 16px; border-radius:40px; font-size:12.5px; color:var(--muted);
  background:rgba(255,255,255,.04); border:1px solid var(--line); backdrop-filter:blur(10px);
  display:inline-flex; align-items:center; gap:8px;
}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* ---------- right: login ---------- */
.side{position:relative; z-index:1; display:grid; place-items:center; padding:32px}
.card{
  width:100%; max-width:410px; padding:44px 38px 38px; border-radius:30px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02)) , var(--glass);
  border:1px solid rgba(255,255,255,.11); backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
  box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 80px rgba(79,140,255,.10), inset 0 1px 0 rgba(255,255,255,.12);
  position:relative; animation:rise .9s cubic-bezier(.2,.9,.25,1) both;
}
.card::before{
  content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
  background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(34,211,238,.7),rgba(155,107,255,.7),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  animation:orbit 7s linear infinite;
}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes orbit{to{--a:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

.card .eyebrow{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:10px}
.card h1{font-family:'Syne',sans-serif; font-weight:700; font-size:28px; margin-bottom:6px}
.card .sub{color:var(--muted); font-size:14px; margin-bottom:30px}

.field{position:relative; margin-bottom:18px}
.field svg{position:absolute; left:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--faint); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s}
.field input{
  width:100%; height:58px; padding:20px 16px 6px 46px; border-radius:16px; border:1px solid var(--line);
  background:rgba(255,255,255,.04); color:#fff; font:500 15px 'DM Sans',sans-serif; outline:none;
  transition:border-color .3s, background .3s, box-shadow .3s;
}
.field label{
  position:absolute; left:46px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--faint);
  pointer-events:none; transition:all .2s ease; transform-origin:left;
}
.field input:focus,.field input:not(:placeholder-shown){}
.field input:focus + label,.field input:not(:placeholder-shown) + label{top:15px; font-size:11px; letter-spacing:.5px; color:var(--cyan)}
.field input:focus{border-color:rgba(34,211,238,.55); background:rgba(255,255,255,.07); box-shadow:0 0 0 4px rgba(34,211,238,.10)}
.field:focus-within svg{stroke:var(--cyan)}

.error{
  display:none; margin:-4px 0 16px; padding:10px 14px; border-radius:12px; font-size:13px; font-weight:500;
  color:#ff9bb3; background:rgba(255,80,120,.10); border:1px solid rgba(255,80,120,.25); border-left:3px solid #ff6b8a;
}
.error.show{display:block; animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.btn{
  width:100%; height:56px; border:none; border-radius:16px; cursor:pointer; position:relative; overflow:hidden;
  font:700 14px 'DM Sans',sans-serif; letter-spacing:1.2px; text-transform:uppercase; color:#04101f;
  background:linear-gradient(110deg,var(--cyan),var(--blue) 50%,var(--violet) 100%); background-size:200% 100%;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 10px 30px rgba(79,140,255,.35); transition:transform .25s cubic-bezier(.34,1.4,.64,1), box-shadow .3s, background-position .6s;
}
.btn::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); transition:left .7s}
.btn:hover{transform:translateY(-2px); background-position:100% 0; box-shadow:0 16px 40px rgba(79,140,255,.5)}
.btn:hover::after{left:130%}
.btn:active{transform:scale(.97)}
.btn:disabled{cursor:progress; filter:saturate(.7); transform:none}
.btn .arrow{transition:transform .3s}
.btn:hover .arrow{transform:translateX(4px)}
.btn:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px}

.loader{margin-top:22px; display:none}
.loader-track{height:4px; border-radius:30px; background:rgba(255,255,255,.08); overflow:hidden}
.loader-fill{height:100%; width:0; border-radius:30px; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink)); transition:width .15s}
.loader-percent{text-align:center; margin-top:8px; font-size:12px; color:var(--muted); letter-spacing:.5px}

.foot{margin-top:26px; text-align:center; font-size:12px; color:var(--faint)}

/* ---------- PDF Tools: icon only ---------- */
.pdf-dock{position:fixed; top:20px; right:20px; z-index:30}
.pdf-icon-btn{
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  background:var(--glass); border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.75);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transition:transform .3s cubic-bezier(.34,1.5,.64,1), color .3s, border-color .3s, box-shadow .3s;
}
.pdf-icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pdf-icon-btn:hover,.pdf-icon-btn[aria-expanded="true"]{color:#fff; border-color:rgba(34,211,238,.5); box-shadow:0 0 26px rgba(34,211,238,.25); transform:translateY(-2px)}
.pdf-icon-btn:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px}
.pdf-pop{
  position:absolute; top:56px; right:0; white-space:nowrap; padding:8px; border-radius:16px;
  background:rgba(14,19,40,.8); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-8px) scale(.96); transform-origin:top right;
  transition:opacity .3s, transform .3s cubic-bezier(.34,1.3,.64,1), visibility .3s;
}
.pdf-pop.open{opacity:1; visibility:visible; pointer-events:auto; transform:none}
.pdf-pop a{
  display:flex; align-items:center; gap:10px; padding:11px 16px; border-radius:11px; color:rgba(255,255,255,.85);
  text-decoration:none; font-size:13.5px; font-weight:500; transition:background .25s, color .25s;
}
.pdf-pop a:hover{background:rgba(255,255,255,.08); color:#fff}
.pdf-pop a span{transition:transform .3s}
.pdf-pop a:hover span{transform:translateX(4px)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  body{grid-template-columns:1fr; overflow:auto; overflow-x:hidden}
  .brand{min-height:0; padding:30px 24px 0; gap:22px}
  .hero,.route,.chips{display:none}
  .side{padding:24px 18px 40px; align-content:start; min-height:0}
  .card{padding:34px 24px 28px}
  .pdf-dock{top:14px; right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>
</div>

<!-- PDF Tools: icon only -->
<div class="pdf-dock" id="pdfDock">
  <button class="pdf-icon-btn" id="pdfBtn" type="button" title="PDF Tools" aria-label="PDF Tools" aria-expanded="false" aria-controls="pdfPop">
    <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
  </button>
  <div class="pdf-pop" id="pdfPop" role="region" aria-label="PDF Tools">
    <a href="pdf.html">Open PDF Tools <span>→</span></a>
  </div>
</div>

<!-- LEFT: brand -->
<section class="brand">
  <div class="logo">
    <div class="logo-mark">LC</div>
    <div class="logo-text">TradeFlow LC</div>
  </div>

  <div class="hero">
    <h2>Every LC date,<br><span>every amount,</span><br>worked out fast.</h2>
    <p>Calculate LC expiry dates and convert amounts to words, all in one place.</p>

    <div class="route" aria-hidden="true">
      <svg viewBox="0 0 520 150">
        <defs>
          <linearGradient id="routeGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset=".6" stop-color="#9b6bff"/><stop offset="1" stop-color="#ff5fd2"/>
          </linearGradient>
        </defs>
        <path id="rp" class="track" d="M30 110 C130 10, 230 150, 330 70 S470 30, 495 60"/>
        <path class="done" d="M30 110 C130 10, 230 150, 330 70 S470 30, 495 60"/>
        <g>
          <circle cx="30" cy="110" r="6" fill="#22d3ee"/><circle class="node-ring" cx="30" cy="110" r="6"/>
          <circle cx="330" cy="70" r="5" fill="#9b6bff"/>
          <circle cx="495" cy="60" r="6" fill="#ff5fd2"/><circle class="node-ring" cx="495" cy="60" r="6" style="animation-delay:1.4s;stroke:#ff5fd2"/>
        </g>
        <text x="30" y="135" text-anchor="middle">LC open date</text>
        <text x="330" y="95" text-anchor="middle">Presentation period</text>
        <text x="495" y="84" text-anchor="end">Expiry date</text>
        <g>
          <circle r="7" fill="#fff"><animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear"><mpath href="#rp"/></animateMotion></circle>
        </g>
      </svg>
    </div>
  </div>

  <div class="chips">
    <span class="chip"><i></i>LC expiry date</span>
    <span class="chip"><i></i>Number to words</span>
    <span class="chip"><i></i>PDF tools</span>
  </div>
</section>

<!-- RIGHT: login -->
<main class="side">
  <div class="card">
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in</h1>
    <p class="sub">Enter your username to continue.</p>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
        <input id="username" placeholder=" " autocomplete="off" aria-label="Username">
        <label for="username">Username</label>
      </div>
      <div id="error" class="error" role="alert"></div>
      <button class="btn" id="enterBtn" type="submit"><span>Enter</span><span class="arrow">→</span></button>
    </form>

    <div class="loader" id="loaderWrapper">
      <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
      <div class="loader-percent" id="loaderPercent">0%</div>
    </div>

    <div class="foot">TradeFlow LC</div>
  </div>
</main>

<script>
// ---- PDF Tools icon (opens a small menu) ----
(() => {
  const dock = document.getElementById('pdfDock');
  const btn = document.getElementById('pdfBtn');
  const pop = document.getElementById('pdfPop');
  const setOpen = o => { btn.setAttribute('aria-expanded', String(o)); pop.classList.toggle('open', o); };
  btn.addEventListener('click', () => setOpen(btn.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('click', e => { if (!dock.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { setOpen(false); btn.focus(); } });
})();

// ---- Login logic ----
const form = document.getElementById('loginForm');
const input = document.getElementById('username');
const error = document.getElementById('error');
const enterBtn = document.getElementById('enterBtn');
const loaderWrapper = document.getElementById('loaderWrapper');
const loaderFill = document.getElementById('loaderFill');
const loaderPercent = document.getElementById('loaderPercent');

function showError(msg) {
  error.textContent = msg;
  error.classList.remove('show'); void error.offsetWidth; error.classList.add('show');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const name = input.value.trim();

  if (name === '') return showError('⛔ Username cannot be empty');
  if (name.length < 2) return showError('❗ Username must contain at least 2 characters');
  if (!/^[a-zA-Z0-9._\-\s]+$/.test(name)) return showError('⚠ Only letters, numbers, spaces, . _ and - are allowed');

  error.classList.remove('show');
  try { localStorage.setItem('currentUserName', name); } catch (_) {}

  enterBtn.disabled = true;
  loaderWrapper.style.display = 'block';
  let progress = 0;
  const interval = setInterval(() => {
    progress = Math.min(100, progress + Math.floor(Math.random() * 8) + 3);
    loaderFill.style.width = progress + '%';
    loaderPercent.textContent = progress + '%';
    if (progress >= 100) clearInterval(interval);
  }, 80);

  try {
    const response = await fetch('https://formspree.io/f/moeaveyg', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: name })
    });
    console.log(response.ok ? 'Form submitted successfully!' : 'Form submission failed');
  } catch (err) {
    console.error('Error:', err);
  }

  setTimeout(() => {
    clearInterval(interval);
    loaderFill.style.width = '100%';
    loaderPercent.textContent = '100%';
    setTimeout(() => { window.location.href = 'main.html'; }, 400);
  }, 1200);
});
</script>
</body>
</html>
