<style>
/* Your existing CSS styles remain exactly the same */
:root {
  --bg: linear-gradient(135deg, #121212 0%, #1a1a2e 50%, #16213e 100%);
  --text: #f8f9fa;
  --card: rgba(30, 30, 46, 0.85);
  --primary: #6c5ce7;
  --secondary: #00cec9;
  --accent: #fd79a8;
  --border: rgba(109, 92, 231, 0.3);
  --input-bg: rgba(42, 42, 62, 0.7);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  --glow: 0 0 20px rgba(108, 92, 231, 0.5);
}

.light-mode {
  --bg: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%);
  --text: #212529;
  --card: rgba(255, 255, 255, 0.9);
  --primary: #6c5ce7;
  --secondary: #00cec9;
  --accent: #fd79a8;
  --border: rgba(108, 92, 231, 0.2);
  --input-bg: rgba(248, 249, 250, 0.7);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  --glow: 0 0 20px rgba(108, 92, 231, 0.3);
}

* {
  box-sizing: border-box;
}

body {
  --bg:
    radial-gradient(circle at top left, rgba(0, 229, 255, 0.25) 0%, transparent 30%),
    radial-gradient(circle at bottom right, rgba(108, 92, 231, 0.25) 0%, transparent 30%),
    radial-gradient(circle at center, rgba(253, 121, 168, 0.10) 0%, transparent 40%),
    linear-gradient(135deg, #050814 0%, #0b1022 45%, #070b17 100%);

  background: var(--bg);
  background-attachment: fixed;

  color: var(--text);

  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;

  margin: 0;
  padding: 20px;

  min-height: 100vh;

  transition:
    background 0.8s ease,
    color 0.5s ease;

  overflow-x: hidden;
  position: relative;
  isolation: isolate;
}

/* LIQUID AURORA LAYER */
body::before {
  content: '';

  position: fixed;
  inset: -30%;

  background:
    radial-gradient(circle at 20% 30%,
      rgba(0, 229, 255, 0.22) 0%,
      transparent 28%),

    radial-gradient(circle at 80% 70%,
      rgba(108, 92, 231, 0.22) 0%,
      transparent 30%),

    radial-gradient(circle at 50% 50%,
      rgba(253, 121, 168, 0.14) 0%,
      transparent 40%),

    radial-gradient(circle at 30% 80%,
      rgba(0, 206, 201, 0.12) 0%,
      transparent 35%),

    radial-gradient(circle at 70% 20%,
      rgba(255,255,255,0.05) 0%,
      transparent 25%);

  filter: blur(55px) saturate(160%);

  animation: liquidAurora 14s ease-in-out infinite alternate;

  z-index: -2;
}

/* GLASS + WATER RIPPLE TEXTURE */
body::after {
  content: '';

  position: fixed;
  inset: 0;

  background:
    linear-gradient(
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.01)
    ),

    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.02) 0px,
      transparent 2px,
      transparent 4px
    );

  mix-blend-mode: soft-light;
  opacity: 0.6;

  pointer-events: none;

  z-index: -1;

  animation: glassFlow 8s linear infinite;
}

/* LIQUID AURORA MOTION */
@keyframes liquidAurora {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
  }

  25% {
    transform: translate(20px, -25px) scale(1.08) rotate(1deg);
  }

  50% {
    transform: translate(-25px, 20px) scale(1.12) rotate(-1deg);
  }

  75% {
    transform: translate(25px, 10px) scale(1.05) rotate(2deg);
  }

  100% {
    transform: translate(0, 0) scale(1) rotate(0deg);
  }
}

/* subtle moving glass shimmer */
@keyframes glassFlow {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(20px);
  }
}

.container {
  max-width: 500px;
  margin: 0 auto;
  background: var(--card);
  padding: 30px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  transform: translateY(0);
  opacity: 1;
  transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              opacity 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
}

.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
  animation: shimmer 3s infinite linear;
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.container.hidden {
  transform: translateY(30px);
  opacity: 0;
}

h1 {
  text-align: center;
  margin: 0 0 25px;
  color: var(--primary);
  animation: titleGlow 2s ease-in-out infinite alternate;
  font-weight: 200;
  font-size: 1.6rem;
  position: relative;
  padding-bottom: 15px;
}

h1::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 0.1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  border-radius: 3px;
}

@keyframes titleGlow {
  from { text-shadow: 0 0 5px rgba(108, 92, 231, 0.5); }
  to { text-shadow: 0 0 15px rgba(108, 92, 231, 0.8), 0 0 25px rgba(108, 92, 231, 0.4); }
}

.input-group {
  margin-bottom: 25px;
  animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  opacity: 0;
  transform: translateY(30px);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.input-group:nth-child(1) { animation-delay: 0.1s; }
.input-group:nth-child(2) { animation-delay: 0.2s; }
.input-group:nth-child(3) { animation-delay: 0.3s; }

label {
  display: block;
  margin-bottom: 10px;
  font-weight: 600;
  color: var(--text);
  transition: all 0.3s ease;
  position: relative;
  padding-left: 15px;
}

label::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  background: var(--primary);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.7); }
  70% { box-shadow: 0 0 0 6px rgba(108, 92, 231, 0); }
  100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0); }
}

input, select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-sizing: border-box;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

.number-converter input[type="number"] {
  width: 100%;
  margin-bottom: 10px;
}

input:focus, select:focus {
  border-color: var(--primary);
  outline: none;
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 0 10px var(--primary), 0 0 25px var(--primary);
}

.result-card {
  background: var(--card);
  padding: 20px;
  margin: 20px 0;
  border-radius: 15px;
  border-left: 4px solid var(--primary);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform: scale(1);
  opacity: 1;
  animation: cardAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  position: relative;
  overflow: hidden;
}

.result-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  transform: translateX(-100%);
}

.result-card:hover::before {
  animation: shine 1.5s ease;
}

@keyframes shine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

@keyframes cardAppear {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.result-card.secondary {
  border-left-color: var(--secondary);
}

.result-card.accent {
  border-left-color: var(--accent);
}

.result-card.hidden {
  transform: scale(0.95);
  opacity: 0;
  height: 0;
  padding: 0;
  margin: 0;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              padding 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              margin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.result-value {

@keyframes textPop {

  font-weight: 600;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  width: 100%;
  margin-top: 15px;
}

.export-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

/* Sound Toggle */
.sound-toggle {
  position: fixed;
  top: 280px;
  right: 20px;
  background: var(--secondary);
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
  animation: rotateIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.4s;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  font-size: 1.2rem;
}

.sound-toggle:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 206, 201, 0.5);
}

.sound-toggle.muted {
  background: #666;
}

/* Floating particles animation */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.1;
  animation: floatParticle 15s infinite linear;
}

@keyframes floatParticle {
  0% {
    transform: translateY(100vh) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 0.1;
  }
  90% {
    opacity: 0.1;
  }
  100% {
    transform: translateY(-100px) rotate(360deg);
    opacity: 0;
  }
}

/* Responsive adjustments */
@media (max-width: 600px) {
  .container {
    padding: 20px;
    margin: 10px;
  }
  
  h1 {
    font-size: 1.8rem;
  }
  
  .theme-toggle, .game-toggle, .export-toggle, .admin-toggle {
    width: 45px;
    height: 45px;
    top: 15px;
    right: 15px;
  }
  
  .game-toggle {
    top: 70px;
  }
  
  .export-toggle {
    top: 125px;
  }
  
  .admin-toggle {
    top: 180px;
  }
  
  .sound-toggle {
    top: 235px;
  }
  
  .game-window, .export-window {
    padding: 20px;
  }
  
  .game-canvas-container {
    width: 280px;
    height: 280px;
  }
}

/* Notification */
.notification {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--card);
  color: var(--text);
  padding: 15px 25px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  border-left: 4px solid var(--secondary);
  transform: translateX(150%);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 1000;
  backdrop-filter: blur(10px);
}

.notification.show {
  transform: translateX(0);
}

  opacity: 1;

  transform: translateY(0);
}

.cal-tabs { display: flex; gap: 6px; margin-bottom: 10px; }

.cal-tab {
  flex: 1;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s ease;
}

.cal-tab:hover { background: var(--input-bg); }
.cal-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.cal-title { font-weight: 600; text-align: center; flex: 1; }

.cal-nav-btn {
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 0.8rem;
  cursor: pointer;
}

.cal-nav-btn:hover { background: var(--input-bg); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 0.68rem; opacity: 0.7; padding: 2px 0; }

.cal-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  border-radius: 8px;
  border: 1px solid transparent;
  user-select: none;
}

.cal-cell.other { opacity: 0.32; }
.cal-cell.wknd { color: var(--accent); }
.cal-cell.info { cursor: pointer; }
.cal-cell.holiday { background: rgba(230, 57, 70, 0.24); border-color: rgba(230, 57, 70, 0.65); color: var(--text); font-weight: 700; }
.cal-cell.makeup { background: rgba(245, 159, 0, 0.22); border-color: rgba(245, 159, 0, 0.7); color: var(--text); }
.cal-cell.festival { border-color: var(--secondary); box-shadow: inset 0 0 0 1px var(--secondary); color: var(--text); }
.cal-cell.today { outline: 2px solid var(--primary); outline-offset: 1px; }

.cal-badge { position: absolute; top: 1px; right: 3px; font-size: 0.55rem; opacity: 0.9; }

<script>
// ===== ENHANCED USER TRACKING FOR ALL USERS =====
function getCurrentUser() {
    return {
        id: localStorage.getItem('currentUserId') || generateUserId(),
        name: localStorage.getItem('currentUserName') || 'Unknown',
        loginTime: localStorage.getItem('currentLoginTime') || new Date().toISOString()
    };
}

function generateUserId() {
    const id = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    localStorage.setItem('currentUserId', id);
    return id;
}

function trackUserAction(action, details = {}) {
    const currentUser = getCurrentUser();
    const actionData = {
        id: generateActionId(),
        userId: currentUser.id,
        userName: currentUser.name,
        action: action,
        timestamp: new Date().toISOString(),
        details: details
    };
    
    console.log('🎯 USER ACTION TRACKED:', actionData);
    
    // Store action in ALL user actions
    const allUserActions = JSON.parse(localStorage.getItem('allUserActions') || '[]');
    allUserActions.push(actionData);
    localStorage.setItem('allUserActions', JSON.stringify(allUserActions));
    
    // Update user's last activity
    updateUserLastActivity(currentUser.id);
}

function trackPageView() {
    const currentUser = getCurrentUser();
    const pageView = {
        id: generateActionId(),
        userId: currentUser.id,
        userName: currentUser.name,
        page: 'main.html',
        timestamp: new Date().toISOString(),
        referrer: document.referrer || 'Direct visit'
    };
    
    const allPageViews = JSON.parse(localStorage.getItem('allPageViews') || '[]');
    allPageViews.push(pageView);
    localStorage.setItem('allPageViews', JSON.stringify(allPageViews));
    
    console.log('📈 PAGE VIEW TRACKED for user:', currentUser.name);
}

function updateUserLastActivity(userId) {
    const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
    const userIndex = allUsers.findIndex(user => user.id === userId);
    
    if (userIndex !== -1) {
        allUsers[userIndex].lastActivity = new Date().toISOString();
        localStorage.setItem('allUsers', JSON.stringify(allUsers));
    }
}

function generateActionId() {
    return 'action_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
}

function checkLogin() {
    const userName = localStorage.getItem('currentUserName');
    if (!userName) {
        window.location.href = 'login.html';
        return;
    }
    document.getElementById('currentUser').textContent = userName;
    
    // Track user session
    trackUserSession();
}

function trackUserSession() {
    const currentUser = getCurrentUser();
    trackPageView();
    
    console.log('📊 USER SESSION STARTED:', currentUser);
}

function logout() {
    const currentUser = getCurrentUser();
    
    // Track logout
    trackUserAction('user_logout', {
        logoutTime: new Date().toISOString()
    });
    
    console.log('🚪 USER LOGOUT:', currentUser.name);
    
    // Clear current session data (keep historical data)
    localStorage.removeItem('currentUserName');
    localStorage.removeItem('currentLoginTime');
    localStorage.removeItem('currentUserId');
    
    window.location.href = 'index.html';
}

function showWelcomeMessage() {
    const userName = localStorage.getItem('currentUserName') || 'Guest';
    setTimeout(() => {
        showNotification(`Welcome ${userName} to TradeFlow LC !`);
    }, 1000);
}

function showAdmin() {
    trackUserAction('admin_access_attempted');
    window.location.href = 'admin.html';
}

// Create floating particles
function createParticles() {
  const particlesContainer = document.getElementById('particles');
  const particleCount = 30;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    
    const size = Math.random() * 5 + 3;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    
    particle.style.left = `${Math.random() * 100}vw`;
    
    const colors = ['var(--primary)', 'var(--secondary)', 'var(--accent)'];
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    
    const duration = Math.random() * 20 + 10;
    const delay = Math.random() * 10;
    particle.style.animationDuration = `${duration}s`;
    particle.style.animationDelay = `${delay}s`;
    
    particlesContainer.appendChild(particle);
  }
}

// Sound system
let soundEnabled = true;
const sounds = {
  click: new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=='),
  success: new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=='),
  error: new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==')
};

function playSound(soundName) {
  if (soundEnabled && sounds[soundName]) {
    sounds[soundName].play().catch(e => console.log('Audio play failed:', e));
  }
}

function toggleSound() {
  trackUserAction('sound_toggled', { soundEnabled: !soundEnabled });
  soundEnabled = !soundEnabled;
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  soundToggle.classList.toggle('muted', !soundEnabled);
  playSound('click');
  showNotification(soundEnabled ? 'Sound enabled' : 'Sound muted');
}

function showNotification(message) {
  const notification = document.getElementById('notification');
  const notificationText = document.getElementById('notificationText');
  
  notificationText.textContent = message;
  notification.classList.add('show');
  
  setTimeout(() => {
    notification.classList.remove('show');
  }, 3000);
}

function toggleTheme() {
  trackUserAction('theme_toggled', { 
    currentTheme: document.body.classList.contains('light-mode') ? 'light' : 'dark' 
  });
  playSound('click');
  document.body.classList.toggle('light-mode');
  const btn = document.querySelector('.theme-toggle');
  btn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  
  localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  
  btn.style.animation = 'none';
  setTimeout(() => {
    btn.style.animation = 'rotateIn 0.6s ease';
  }, 10);
}

function detectSystemTheme() {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.body.classList.add('light-mode');
    document.querySelector('.theme-toggle').textContent = '☀️';
  }
  
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    document.body.classList.add('light-mode');
    document.querySelector('.theme-toggle').textContent = '☀️';
  } else if (savedTheme === 'dark') {
    document.body.classList.remove('light-mode');
    document.querySelector('.theme-toggle').textContent = '🌙';
  }
}

function animateCreatorBadge() {
  trackUserAction('creator_badge_clicked');
  playSound('click');
  const badge = document.getElementById('creatorBadge');
  badge.style.animation = 'none';
  setTimeout(() => {
    badge.style.animation = 'bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

function showElement(element) {
  element.classList.remove('hidden');
  element.style.animation = 'none';
  setTimeout(() => {
    element.style.animation = 'cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
  }, 10);
}

function hideElement(element) {
  element.classList.add('hidden');
}

// Main calculation function: supports 30/60/90 days dynamically
function calculateAll() {
  trackUserAction('date_calculation', {
    inputDate: document.getElementById('inputDate').value,
    daysToSubtract: document.getElementById('subDays').value,
    expiryPeriod: document.getElementById('expiryDays').value
  });
  
  const inputDate = document.getElementById('inputDate').value;
  const daysToSubtract = parseInt(document.getElementById('subDays').value) || 0;
  
  const date90Card = document.getElementById('date90Card');
  const finalDateCard = document.getElementById('finalDateCard');
  
  if (inputDate) {
    const parts = inputDate.split('-');
    const expiryDays = parseInt(document.getElementById('expiryDays').value) || 90;

    const date90 = new Date(parts[0], parts[1]-1, parts[2]);
    date90.setDate(date90.getDate() + expiryDays);

    document.getElementById('expiryLabel').textContent = `[${expiryDays}-Day] EXPIRY DATE:`;
    document.getElementById('date90').textContent = formatDate(date90);
    showElement(date90Card);
    
    if (!isNaN(daysToSubtract) && daysToSubtract > 0) {
      const finalDate = new Date(date90);
      finalDate.setDate(finalDate.getDate() - daysToSubtract);
      document.getElementById('finalDate').textContent = formatDate(finalDate);
      showElement(finalDateCard);
    } else {
      hideElement(finalDateCard);
    }
  } else {
    hideElement(date90Card);
    hideElement(finalDateCard);
  }
}

function formatDate(date) {
  const day = date.getDate().toString().padStart(2, '0');
  const month = (date.getMonth()+1).toString().padStart(2, '0');
  const year = date.getFullYear();
  return `${day}/${month}/${year}`;
}

function convertNumberToWords() {
  trackUserAction('number_conversion', {
    number: document.getElementById('numberInput').value,
    currency: document.getElementById('currencySelect').value
  });
  
  const numberStr = document.getElementById('numberInput').value;
  const currency = document.getElementById('currencySelect').value;
  const wordsOutputCard = document.getElementById('wordsOutputCard');
  
  if (!numberStr) {
    hideElement(wordsOutputCard);
    return;
  }
  
  const words = numberToWords(numberStr, currency);
  document.getElementById('wordsOutput').textContent = words || 'ZERO';
  
  const resultText = document.getElementById('wordsOutput');
  resultText.style.animation = 'none';
  setTimeout(() => {
    resultText.style.animation = 'textPop 0.4s ease forwards';
  }, 10);
  
  showElement(wordsOutputCard);
}

function numberToWords(numberStr, currency) {
  if (!numberStr) return '';
  
  const currencyUnits = getCurrencyUnits(currency);
  
  const parts = numberStr.toString().split('.');
  let wholePart = parts[0];
  let decimalPart = parts.length > 1 ? parts[1] : '';
  
  if (currency === 'JPY') {
    decimalPart = '';
  }
  
  let words = convertWholeNumber(wholePart);
  
  if (words) {
    words += ' ' + (parseInt(wholePart) === 1 ? currencyUnits.whole.singular : currencyUnits.whole.plural);
  } else {
    words = 'ZERO ' + currencyUnits.whole.plural;
  }
  
  if (decimalPart && decimalPart.length > 0 && currency !== 'JPY') {
    if (decimalPart.length === 1) decimalPart += '0';
    decimalPart = decimalPart.substring(0, 2);
    
    const decimalValue = parseInt(decimalPart);
    if (decimalValue > 0) {
      const decimalWords = convertWholeNumber(decimalPart);
      if (decimalWords) {
        words += ' AND ' + decimalWords;
        words += ' ' + (decimalValue === 1 ? currencyUnits.fraction.singular : currencyUnits.fraction.plural);
      }
    }
  }
  
  return words;
}

function getCurrencyUnits(currency) {
  const currencies = {
    USD: { whole: { singular: 'DOLLAR', plural: 'DOLLARS' }, fraction: { singular: 'CENT', plural: 'CENTS' } },
    GBP: { whole: { singular: 'POUND', plural: 'POUNDS' }, fraction: { singular: 'PENCE', plural: 'PENCE' } },
    AUD: { whole: { singular: 'DOLLAR', plural: 'DOLLARS' }, fraction: { singular: 'CENT', plural: 'CENTS' } },
    EUR: { whole: { singular: 'EURO', plural: 'EUROS' }, fraction: { singular: 'CENT', plural: 'CENTS' } },
    CAD: { whole: { singular: 'DOLLAR', plural: 'DOLLARS' }, fraction: { singular: 'CENT', plural: 'CENTS' } },
    THB: { whole: { singular: 'BAHT', plural: 'BAHT' }, fraction: { singular: 'SATANG', plural: 'SATANG' } },
    JPY: { whole: { singular: 'YEN', plural: 'YEN' }, fraction: { singular: '', plural: '' } },
    CNY: { whole: { singular: 'YUAN', plural: 'YUAN' }, fraction: { singular: 'FEN', plural: 'FEN' } },
    INR: { whole: { singular: 'RUPEE', plural: 'RUPEE' }, fraction: { singular: 'PAISE', plural: 'PAISE' } }
  };
  return currencies[currency] || currencies.USD;
}

function convertWholeNumber(numStr) {
  const num = parseInt(numStr);
  if (isNaN(num)) return '';
  if (num === 0) return '';
  
  const units = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE'];
  const teens = ['TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
  const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
  const scales = ['', 'THOUSAND', 'MILLION', 'BILLION'];
  
  if (num < 10) return units[num];
  if (num < 20) return teens[num - 10];
  if (num < 100) {
    const ten = Math.floor(num / 10);
    const unit = num % 10;
    return tens[ten] + (unit ? '-' + units[unit] : '');
  }
  
  if (num < 1000) {
    const hundred = Math.floor(num / 100);
    const remainder = num % 100;
    return units[hundred] + ' HUNDRED' + (remainder ? ' AND ' + convertWholeNumber(remainder.toString()) : '');
  }
  
  for (let i = 0; i < scales.length; i++) {
    const scaleValue = Math.pow(1000, i+1);
    if (num < scaleValue) {
      const scale = Math.floor(num / Math.pow(1000, i));
      const remainder = num % Math.pow(1000, i);
      return convertWholeNumber(scale.toString()) + ' ' + scales[i] + (remainder ? ' ' + convertWholeNumber(remainder.toString()) : '');
    }
  }
  
  return '';
}

function showExport() {
  trackUserAction('export_panel_opened');
  playSound('click');
  document.getElementById('exportContainer').classList.add('show');
}

function hideExport() {

function exportResults() {
  trackUserAction('results_exported', {
    format: document.querySelector('input[name="exportFormat"]:checked').value
  });
  playSound('success');
  
  const exportFormat = document.querySelector('input[name="exportFormat"]:checked').value;
  const includeDate90 = document.getElementById('exportDate90').checked;
  const includeFinalDate = document.getElementById('exportFinalDate').checked;
  const includeNumberWords = document.getElementById('exportNumberWords').checked;
  const includeInputData = document.getElementById('exportInputData').checked;
  
  let content = '⚓ TradeFlow LC Results\n';
  content += '================================\n\n';
  
  if (includeInputData) {
    content += `Input Data:\n`;
    content += `- LC OPEN DATE: ${document.getElementById('inputDate').value || 'Not set'}\n`;
    content += `- PERIOD OF PRESENTATION: ${document.getElementById('subDays').value || '0'}\n`;
    content += `- Number to Convert: ${document.getElementById('numberInput').value || 'Not set'}\n`;
    content += `- Currency: ${document.getElementById('currencySelect').value}\n\n`;
  }
  
  if (includeDate90 && !document.getElementById('date90Card').classList.contains('hidden')) {
    const expiryDays = document.getElementById('expiryDays').value;
    content += `${expiryDays}-Day EXPIRY DATE: ${document.getElementById('date90').textContent}\n`;
  }
  
  if (includeFinalDate && !document.getElementById('finalDateCard').classList.contains('hidden')) {
    content += `Latest Shipment Date: ${document.getElementById('finalDate').textContent}\n`;
  }
  
  if (includeNumberWords && !document.getElementById('wordsOutputCard').classList.contains('hidden')) {
    content += `Number in Words: ${document.getElementById('wordsOutput').textContent}\n`;
  }
  
  content += `\nGenerated on: ${new Date().toLocaleString()}\n`;
  content += `Tool: ⚓ TradeFlow LC by Sethil Yaddehige\n`;
  
  if (exportFormat === 'pdf') {
    showNotification('PDF export would be generated here');
    console.log('PDF Content:', content);
  } else if (exportFormat === 'text') {
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lc-calculation-results.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    showNotification('Results exported as text file');
  } else if (exportFormat === 'print') {
    window.print();
    showNotification('Printing results...');

}

// SHIP GAME Implementation (unchanged)
let canvas, ctx;
let Ship = [];
let food = {};
let gridSize = 20;
let direction = 'right';
let nextDirection = 'right';
let score = 0;
let highScore = 0;
let gameInterval;
let gameRunning = false;
let gamePaused = false;

function showGame() {
  trackUserAction('game_opened');
  playSound('click');
  const gameContainer = document.getElementById('gameContainer');
  gameContainer.classList.add('show');
  initializeGame();
}

function hideGame() {
  playSound('click');
  const gameContainer = document.getElementById('gameContainer');
  gameContainer.classList.remove('show');
  stopGame();
}

function initializeGame() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  const gameOverlay = document.getElementById('gameOverlay');
  gameOverlay.style.display = 'flex';
  document.getElementById('gameOverText').textContent = 'SHIP GAME';
  document.addEventListener('keydown', handleKeyPress);
}

function startGame() {
  trackUserAction('game_started');
  playSound('click');
  const gameOverlay = document.getElementById('gameOverlay');
  gameOverlay.style.display = 'none';
  
  Ship = [
    {x: 5, y: 10},
    {x: 4, y: 10},
    {x: 3, y: 10}
  ];
  
  direction = 'right';
  nextDirection = 'right';
  score = 0;
  updateScore();
  
  generateFood();
  gameRunning = true;
  gamePaused = false;
  
  if (gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, 150);
}

function pauseGame() {
  trackUserAction('game_paused', { paused: !gamePaused });
  playSound('click');
  if (!gameRunning) return;
  
  gamePaused = !gamePaused;
  const gameOverlay = document.getElementById('gameOverlay');
  if (gamePaused) {
    gameOverlay.style.display = 'flex';
    document.getElementById('gameOverText').textContent = 'GAME PAUSED';
  } else {
    gameOverlay.style.display = 'none';
  }
}

function stopGame() {
  gameRunning = false;
  gamePaused = false;
  if (gameInterval) {
    clearInterval(gameInterval);
    gameInterval = null;
  }
}

function gameLoop() {
  if (!gameRunning || gamePaused) return;
  direction = nextDirection;
  moveShip();
  if (checkCollision()) { gameOver(); return; }
  if (checkFoodCollision()) { eatFood(); generateFood(); }
  drawGame();
}

function moveShip() {
  const head = {x: Ship[0].x, y: Ship[0].y};
  switch (direction) {
    case 'up': head.y--; break;
    case 'down': head.y++; break;
    case 'left': head.x--; break;
    case 'right': head.x++; break;
  }
  Ship.unshift(head);
  if (!food.eaten) Ship.pop();
  else food.eaten = false;
}

function checkCollision() {
  const head = Ship[0];
  if (head.x < 0 || head.x >= canvas.width/gridSize || head.y < 0 || head.y >= canvas.height/gridSize) return true;
  for (let i = 1; i < Ship.length; i++) if (head.x === Ship[i].x && head.y === Ship[i].y) return true;
  return false;
}

function checkFoodCollision() { return Ship[0].x === food.x && Ship[0].y === food.y; }

function eatFood() {
  trackUserAction('game_food_eaten', { score: score + 10 });
  playSound('success');
  food.eaten = true;
  score += 10;
  updateScore();
}

function generateFood() {
  food = {
    x: Math.floor(Math.random() * (canvas.width/gridSize)),
    y: Math.floor(Math.random() * (canvas.height/gridSize)),
    eaten: false
  };
  for (let segment of Ship) if (food.x === segment.x && food.y === segment.y) { generateFood(); break; }
}

function drawGame() {
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--input-bg');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  Ship.forEach((segment, index) => {
    ctx.fillStyle = index === 0 ? getComputedStyle(document.documentElement).getPropertyValue('--primary') : getComputedStyle(document.documentElement).getPropertyValue('--secondary');
    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
  });
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
  ctx.fill();
}

function handleKeyPress(e) {
  if (!gameRunning) return;
  switch(e.key) {
    case 'ArrowUp': if (direction !== 'down') nextDirection = 'up'; break;
    case 'ArrowDown': if (direction !== 'up') nextDirection = 'down'; break;
    case 'ArrowLeft': if (direction !== 'right') nextDirection = 'left'; break;
    case 'ArrowRight': if (direction !== 'left') nextDirection = 'right'; break;
  }
}

function gameOver() {
  trackUserAction('game_over', { finalScore: score, highScore: Math.max(score, highScore) });
  playSound('error');
  stopGame();
  const gameOverlay = document.getElementById('gameOverlay');
  gameOverlay.style.display = 'flex';
  document.getElementById('gameOverText').textContent = 'GAME OVER';
  if (score > highScore) { highScore = score; document.getElementById('highScoreValue').textContent = highScore; }
}

function updateScore() { document.getElementById('scoreValue').textContent = score; }

// Initialize
window.onload = function() {
    checkLogin();
    createParticles();
    detectSystemTheme();
    
    const today = new Date();
    const formattedDate = today.toISOString().substring(0, 10);
    document.getElementById('inputDate').value = formattedDate;
    
    initializeGame();
    updateScore();
    document.getElementById('highScoreValue').textContent = highScore;
    
    showWelcomeMessage();
    calculateAll();
};
</script>

  function applyTheme(id, fromUser) {

  btn.addEventListener('click', function (e) {

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanels(); });

  /* The existing moon/sun button keeps its original behaviour.
     If an added theme is active, its first click returns to the classic look. */
  if (typeof window.toggleTheme === 'function') {
    var originalToggle = window.toggleTheme;

      if (current !== 'default') { applyTheme('default', true); return; }
      return originalToggle.apply(this, arguments);

  /* ---------- HOLIDAY DATA ---------- */
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function key(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }           // m is 1-based
  function keyOf(dt) { return key(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }
  function nthMonday(y, m, n) {
    var first = new Date(y, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  }

  /* Japan: rule-based (National Holiday Act) incl. equinoxes, Citizens' Holiday and substitute holidays */
  var jpCache = {};
  function japanYear(y) {
    if (jpCache[y]) return jpCache[y];
    var H = {};
    function add(m, d, en, ja) { H[key(y, m, d)] = { en: en, local: ja, type: 'holiday' }; }
    var k = y - 1980, adj = Math.floor(k / 4);
    var ve = Math.floor(20.8431 + 0.242194 * k - adj);
    var ae = Math.floor(23.2488 + 0.242194 * k - adj);
    add(1, 1, "New Year's Day", '元日');
    add(1, nthMonday(y, 1, 2), 'Coming of Age Day', '成人の日');
    add(2, 11, 'National Foundation Day', '建国記念の日');
    if (y >= 2020) add(2, 23, "Emperor's Birthday", '天皇誕生日');
    add(3, ve, 'Vernal Equinox Day', '春分の日');
    add(4, 29, 'Shōwa Day', '昭和の日');
    add(5, 3, 'Constitution Memorial Day', '憲法記念日');
    add(5, 4, 'Greenery Day', 'みどりの日');
    add(5, 5, "Children's Day", 'こどもの日');
    add(7, nthMonday(y, 7, 3), 'Marine Day', '海の日');
    add(8, 11, 'Mountain Day', '山の日');
    add(9, nthMonday(y, 9, 3), 'Respect for the Aged Day', '敬老の日');
    add(9, ae, 'Autumnal Equinox Day', '秋分の日');
    add(10, nthMonday(y, 10, 2), 'Sports Day', 'スポーツの日');
    add(11, 3, 'Culture Day', '文化の日');
    add(11, 23, 'Labor Thanksgiving Day', '勤労感謝の日');

    var base = Object.assign({}, H);
    // Citizens' Holiday: a normal day sandwiched between two holidays
    for (var d = new Date(y, 0, 2); d.getFullYear() === y; d.setDate(d.getDate() + 1)) {
      var kk = keyOf(d);
      if (base[kk] || d.getDay() === 0) continue;
      var pv = new Date(d); pv.setDate(pv.getDate() - 1);
      var nx = new Date(d); nx.setDate(nx.getDate() + 1);
      if (base[keyOf(pv)] && base[keyOf(nx)]) H[kk] = { en: "Citizens' Holiday", local: '国民の休日', type: 'holiday' };
    }
    // Substitute holiday: holiday on Sunday -> next day that is not already a holiday
    Object.keys(base).forEach(function (kk) {
      var p = kk.split('-');
      var dt = new Date(+p[0], +p[1] - 1, +p[2]);
      if (dt.getDay() !== 0) return;
      do { dt.setDate(dt.getDate() + 1); } while (H[keyOf(dt)]);
      H[keyOf(dt)] = { en: 'Substitute Holiday', local: '振替休日', type: 'holiday' };
    });
    jpCache[y] = H;
    return H;
  }

  /* China: official State Council schedule for 2026 (incl. make-up workdays);
     other years 2025-2030 show festival dates only. */
  var CN_LUNAR = {
    2025: { cny: [1, 29], qm: [4, 4], db: [5, 31], ma: [10, 6] },
    2026: { cny: [2, 17], qm: [4, 5], db: [6, 19], ma: [9, 25] },
    2027: { cny: [2, 6],  qm: [4, 5], db: [6, 9],  ma: [9, 15] },
    2028: { cny: [1, 26], qm: [4, 4], db: [5, 28], ma: [10, 3] },
    2029: { cny: [2, 13], qm: [4, 4], db: [6, 16], ma: [9, 22] },
    2030: { cny: [2, 3],  qm: [4, 5], db: [6, 5],  ma: [9, 12] }
  };
  var cnCache = {};
  function chinaYear(y) {
    if (cnCache[y]) return cnCache[y];
    var M = {};
    function put(m, d, o) { M[key(y, m, d)] = o; }
    function range(m1, d1, m2, d2, o) {
      var dt = new Date(y, m1 - 1, d1), end = new Date(y, m2 - 1, d2);
      while (dt <= end) { M[keyOf(dt)] = Object.assign({}, o); dt.setDate(dt.getDate() + 1); }
    }
    function mk(m, d, why) { put(m, d, { en: 'Make-up workday', local: '补班', type: 'makeup', g: 'mk' + m + '-' + d, note: 'for ' + why }); }
    if (y === 2026) {
      range(1, 1, 1, 3, { en: "New Year's Day", local: '元旦', type: 'holiday', g: 'ny' });
      mk(1, 4, "New Year's Day");
      range(2, 15, 2, 23, { en: 'Spring Festival', local: '春节', type: 'holiday', g: 'sf' });
      put(2, 16, { en: "Chinese New Year's Eve", local: '除夕', type: 'holiday', g: 'sf' });
      put(2, 17, { en: 'Spring Festival (Day 1)', local: '春节', type: 'holiday', g: 'sf' });
      mk(2, 14, 'Spring Festival'); mk(2, 28, 'Spring Festival');
      range(4, 4, 4, 6, { en: 'Qingming Festival', local: '清明节', type: 'holiday', g: 'qm' });
      range(5, 1, 5, 5, { en: 'Labour Day', local: '劳动节', type: 'holiday', g: 'ld' });
      mk(5, 9, 'Labour Day');
      range(6, 19, 6, 21, { en: 'Dragon Boat Festival', local: '端午节', type: 'holiday', g: 'db' });
      range(9, 25, 9, 27, { en: 'Mid-Autumn Festival', local: '中秋节', type: 'holiday', g: 'ma' });
      mk(9, 20, 'National Day');
      range(10, 1, 10, 7, { en: 'National Day', local: '国庆节', type: 'holiday', g: 'nd' });
      mk(10, 10, 'National Day');
    } else {
      put(1, 1, { en: "New Year's Day", local: '元旦', type: 'festival' });
      put(5, 1, { en: 'Labour Day', local: '劳动节', type: 'festival' });
      put(10, 1, { en: 'National Day', local: '国庆节', type: 'festival' });
      var L = CN_LUNAR[y];
      if (L) {
        var eve = new Date(y, L.cny[0] - 1, L.cny[1] - 1);
        put(eve.getMonth() + 1, eve.getDate(), { en: "Chinese New Year's Eve", local: '除夕', type: 'festival' });
        put(L.cny[0], L.cny[1], { en: 'Spring Festival', local: '春节', type: 'festival' });
        put(L.qm[0], L.qm[1], { en: 'Qingming Festival', local: '清明节', type: 'festival' });

        put(L.ma[0], L.ma[1], { en: 'Mid-Autumn Festival', local: '中秋节', type: 'festival' });
      }
    }
    cnCache[y] = M;
    return M;
  }

  function getInfo(region, dt) {
    var y = dt.getFullYear();
    var map = region === 'jp' ? japanYear(y) : chinaYear(y);

  /* ---------- CALENDAR UI ---------- */
  var region = safeGet('calRegion') === 'cn' ? 'cn' : 'jp';
  var now = new Date();
  var viewY = now.getFullYear(), viewM = now.getMonth();
  var elGrid = document.getElementById('calGrid');
  var elTitle = document.getElementById('calTitle');
  var elDetail = document.getElementById('calDetail');
  var elNextH = document.getElementById('calNextHoliday');
  var elList = document.getElementById('calList');

  function label(inf) {
    return inf.en + ' <span class="cal-local">' + inf.local + '</span>' + (inf.note ? ' · ' + inf.note : '');

  function shortDate(dt) { return MON3[dt.getMonth()] + ' ' + dt.getDate() + ' (' + DOW3[dt.getDay()] + ')'; }

  function renderCalendar() {
    document.querySelectorAll('.cal-tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.region === region);

    var html = order.map(function (i) { return '<div class="cal-dow">' + DOW3[i] + '</div>'; }).join('');

    var startDow = order[0];
    var first = new Date(viewY, viewM, 1);
    var lead = (first.getDay() - startDow + 7) % 7;
    var todayKey = keyOf(new Date());
    for (var i = 0; i < 42; i++) {
      var dt = new Date(viewY, viewM, 1 - lead + i);
      var inf = getInfo(region, dt);
      var cls = 'cal-cell';
      if (dt.getMonth() !== viewM) cls += ' other';
      if (dt.getDay() === 0 || dt.getDay() === 6) cls += ' wknd';
      if (keyOf(dt) === todayKey) cls += ' today';
      var extra = '', attr = '';
      if (inf) {
        cls += ' info ' + inf.type;
        attr = ' data-k="' + keyOf(dt) + '" title="' + (inf.en + ' ' + inf.local).replace(/"/g, '') + '"';
        if (inf.type === 'makeup') extra = '<span class="cal-badge">班</span>';
      }
      html += '<div class="' + cls + '"' + attr + '>' + dt.getDate() + extra + '</div>';
    }
    elGrid.innerHTML = html;
    elDetail.textContent = 'Tap a highlighted day for details.';

    // list for this month (consecutive days of the same holiday are merged)
    var days = new Date(viewY, viewM + 1, 0).getDate();
    var groups = [], cur = null;
    for (var d = 1; d <= days; d++) {
      var day = new Date(viewY, viewM, d);
      var info = getInfo(region, day);
      if (!info) { cur = null; continue; }
      var gk = (info.g || info.en) + '|' + info.type;
      if (cur && cur.gk === gk) { cur.end = day; }
      else { cur = { gk: gk, start: day, end: day, inf: info }; groups.push(cur); }
    }
    if (!groups.length) {
      elList.innerHTML = '<li>No holidays this month.</li>';
    } else {
      elList.innerHTML = groups.map(function (g) {
        var when = g.start.getTime() === g.end.getTime()
          ? shortDate(g.start)
          : MON3[g.start.getMonth()] + ' ' + g.start.getDate() + '–' + g.end.getDate();
        return '<li><span class="cal-dot ' + g.inf.type + '"></span><span class="cal-when">' + when + '</span><span>' + label(g.inf) + '</span></li>';
      }).join('');
    }

    // next holiday from today
    var t0 = new Date(); t0.setHours(0, 0, 0, 0);
    var nextTxt = '';
    for (var n = 0; n < 800; n++) {
      var nd = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + n);
      var ni = getInfo(region, nd);
      if (ni && (ni.type === 'holiday' || ni.type === 'festival')) {
        var when2 = n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days';
        nextTxt = '⏭ Next: <b>' + ni.en + '</b> <span class="cal-local">' + ni.local + '</span> · ' + shortDate(nd) + ' · ' + when2;
        break;
      }
    }
    elNextH.innerHTML = nextTxt || 'No upcoming holidays found.';

    var legend = '<span><i class="cal-dot holiday"></i>Public holiday</span>';
    if (region === 'cn') legend += '<span><i class="cal-dot makeup"></i>Make-up workday 班</span><span><i class="cal-dot festival"></i>Festival date</span>';
    elLegend.innerHTML = legend;
    elNote.textContent = region === 'jp'
      ? 'Japan: calculated from the National Holiday Act rules (incl. equinox days, Citizens\u2019 Holidays and substitute holidays).'
      : 'China: 2026 shows the official State Council schedule with make-up workdays. Other years show festival dates only; the 2027 official schedule is expected in late 2026.';
  }

  elGrid.addEventListener('click', function (e) {
    var cell = e.target.closest('.cal-cell.info');
    if (!cell) return;
    var p = cell.dataset.k.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var inf = getInfo(region, dt);
    if (inf) elDetail.innerHTML = '<b>' + shortDate(dt) + '</b> · ' + label(inf);
  });

  document.querySelectorAll('.cal-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      region = t.dataset.region;
      safeSet('calRegion', region);
      renderCalendar();
    });
  });
  document.getElementById('calPrev').addEventListener('click', function () {
    viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', function () {
    viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCalendar();
  });
  document.getElementById('calToday').addEventListener('click', function () {
    var t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth(); renderCalendar();
  });

  applyTheme(safeGet(KEY) || 'default', false);
})();
</script>
</body>
</html>
